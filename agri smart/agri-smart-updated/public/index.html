/* Agri-Smart visual refresh — same green / cream palette */
:root{--green-deep:#123e27;--green-soft:#eaf5e5;--ease:cubic-bezier(.2,.75,.25,1)}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 8% 0%,rgba(223,242,189,.42),transparent 34%),var(--bg)}
.top{background:linear-gradient(115deg,#103a25 0%,#1f7040 58%,#2e8a50 100%);background-size:180% 180%;animation:headerGlow 14s ease infinite}
.brand{letter-spacing:-.35px}
.logo{box-shadow:0 5px 16px rgba(0,0,0,.13);transition:transform .35s var(--ease),box-shadow .35s}
.brand:hover .logo{transform:rotate(-9deg) scale(1.08);box-shadow:0 8px 22px rgba(0,0,0,.2)}
/* The requested navigation BAR: a distinct, full-width strip below the brand row */
.navlinks{align-items:center;padding:7px;background:rgba(7,42,23,.22);border:1px solid rgba(255,255,255,.14);border-radius:16px;backdrop-filter:blur(12px)}
.navlinks button{position:relative;border:1px solid transparent;border-radius:11px;transition:background .22s,color .22s,transform .22s,box-shadow .22s}
.navlinks button:hover{transform:translateY(-2px);box-shadow:0 5px 14px rgba(0,0,0,.12)}
.navlinks button.active{box-shadow:0 4px 14px rgba(0,0,0,.12);font-weight:800}
.menu-toggle{align-items:center;gap:9px;display:none;transition:background .2s,transform .2s}
.hamburger-lines{width:20px;display:grid;gap:4px}
.hamburger-lines i{height:2px;width:20px;background:currentColor;border-radius:4px;display:block;transition:transform .25s,opacity .2s}
.menu-toggle.is-open .hamburger-lines i:first-child{transform:translateY(6px) rotate(45deg)}
.menu-toggle.is-open .hamburger-lines i:nth-child(2){opacity:0}
.menu-toggle.is-open .hamburger-lines i:last-child{transform:translateY(-6px) rotate(-45deg)}
.menu-toggle:hover{background:rgba(255,255,255,.22);transform:scale(1.03)}
/* Gentle entrance and hover effects */
@keyframes headerGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes softFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.container{animation:riseIn .55s var(--ease) both}
.hero-card{position:relative;overflow:hidden;box-shadow:0 14px 38px rgba(32,72,45,.08);transition:transform .35s var(--ease),box-shadow .35s}
.hero-card:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-110px;top:-125px;background:rgba(255,255,255,.27);pointer-events:none}
.feature,.panel,.stat,.item,.auth{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.feature:hover,.stat:hover,.item:hover{transform:translateY(-4px);box-shadow:0 18px 38px rgba(32,72,45,.13);border-color:#b9d8bd}
button,.primary,.secondary{transition:transform .18s var(--ease),box-shadow .18s,filter .18s}
button:active,.primary:active,.secondary:active{transform:scale(.97)}
.primary:hover,.secondary:hover{filter:brightness(1.04);box-shadow:0 7px 18px rgba(31,122,69,.18)}
.field input,.field select,.field textarea{transition:border-color .2s,box-shadow .2s,background .2s}
.hero-card>.pill{background:#d5e9c7;color:#173f27;border:1px solid #9fbd94}.global-voice{animation:softFloat 3.8s ease-in-out infinite;transition:transform .2s,box-shadow .2s}
.global-voice:hover{transform:translateY(-4px) scale(1.04);box-shadow:0 12px 28px rgba(0,0,0,.22)}
/* Mobile: hamburger opens a clear navigation bar directly below the header row */
@media(max-width:760px){
 .top{box-shadow:0 8px 24px rgba(0,0,0,.14)}
 .nav{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px}
 .menu-toggle{display:flex;justify-content:center;min-width:88px;padding:10px 13px;font-weight:750}
 .navlinks{grid-column:1/-1;display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;max-height:0;opacity:0;overflow:hidden;padding:0 9px;margin:0;border-width:0;pointer-events:none;transform:translateY(-8px);transition:max-height .35s var(--ease),opacity .25s,padding .3s,margin .3s,transform .3s,border-width .2s}
 .navlinks.open{max-height:520px;opacity:1;padding:9px;margin-top:2px;border-width:1px;pointer-events:auto;transform:translateY(0)}
 .navlinks button{width:100%;text-align:left;padding:12px 14px;border-radius:10px}
 .navlinks button.active{background:#fff;color:#185b32}
 .hero-card{animation:riseIn .65s var(--ease) both}
 .feature-grid,.cards,.grid2,.grid3{gap:12px}
 .panel,.feature,.auth{border-radius:16px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.nav{display:grid!important;grid-template-columns:1fr auto;align-items:center!important;gap:12px!important}
.menu-toggle{display:flex!important;align-items:center;justify-content:center;gap:9px;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.13);color:#fff;border-radius:12px;padding:11px 15px;font-size:15px;font-weight:800;min-width:104px;box-shadow:0 5px 16px rgba(0,0,0,.12)}
.hamburger-lines{width:21px;display:grid;gap:5px}
.hamburger-lines i{display:block;height:2px;width:21px;background:currentColor;border-radius:4px;transition:transform .25s,opacity .2s}
.menu-toggle.is-open .hamburger-lines i:first-child{transform:translateY(7px) rotate(45deg)}
.menu-toggle.is-open .hamburger-lines i:nth-child(2){opacity:0}
.menu-toggle.is-open .hamburger-lines i:last-child{transform:translateY(-7px) rotate(-45deg)}
.navlinks{grid-column:1/-1!important;display:flex!important;flex-direction:row;flex-wrap:wrap;gap:8px;width:100%;max-height:0;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;padding:0 10px;margin:0;border:1px solid transparent;border-radius:15px;background:rgba(5,42,22,.24);backdrop-filter:blur(12px);transform:translateY(-8px);transition:max-height .35s ease,opacity .25s ease,transform .25s ease,padding .25s ease,margin .25s ease,visibility .25s}
.navlinks.open{max-height:360px;opacity:1;visibility:visible;pointer-events:auto;padding:10px;margin-top:4px;border-color:rgba(255,255,255,.2);transform:translateY(0)}
.navlinks button{flex:0 0 auto;min-height:42px}
@media(max-width:760px){
 .top{padding:13px 16px}
 .navlinks{flex-direction:column;align-items:stretch}
 .navlinks button{width:100%;text-align:left;padding:12px 14px}

/* Brand identity and real crop photography */
.logo{width:54px!important;height:54px!important;overflow:hidden;border-radius:50%;background:#fff!important;border:2px solid rgba(255,255,255,.75);box-shadow:0 3px 12px rgba(0,0,0,.18)}

:root{color-scheme:light;--field-bg:#fff;--panel-soft:#fbfdf9}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1710;--card:#13251a;--ink:#e8f3e9;--muted:#a4b6a8;--line:#294333;--green:#56c77b;--green2:#35a963;--lime:#315b38;--shadow:0 18px 48px rgba(0,0,0,.28);--field-bg:#102117;--panel-soft:#172c1e}
body{background:var(--bg);color:var(--ink);transition:background .25s,color .25s}

const state={token:localStorage.getItem('agri_token'),user:null,view:'home',dash:null,states:[],sources:[],adminUsers:[],audit:[],tab:'farms',language:localStorage.getItem('agri_language')||'en'};
const api=async(path,opts={})=>{const headers={'Content-Type':'application/json',...(opts.headers||{})};if(state.token)headers.Authorization='Bearer '+state.token;const r=await fetch(path,{...opts,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function nav(){return `<div class="top"><div class="nav"><div class="brand"><div class="logo"><img src="/agri-smart-logo.webp" alt="Agri-Smart logo"></div><span>Agri-Smart</span></div><button class="menu-toggle" id="menuToggle" type="button" aria-label="Open navigation menu" aria-expanded="false" onclick="toggleNav()"><span class="hamburger-lines"><i></i><i></i><i></i></span><span class="menu-word">Menu</span></button><div class="navlinks" id="mainNav">${[['home','Home'],['dashboard','My Farm'],['recommend','Crop Recommendation'],['sources','Agri Sources']].map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}${state.user?.role==='admin'?`<button onclick="go('admin')">Operator</button>`:''}<button class="theme-toggle" type="button" onclick="toggleTheme()" id="themeToggle" aria-label="Switch colour theme">☾ Dark mode</button><button onclick="go('settings')"> Settings</button>${state.user?`<button onclick="logout()">Logout</button>`:`<button onclick="go('login')">Login</button>`}</div></div></div>`}
function applyTheme(mode){
 const theme=mode==='dark'?'dark':'light';
 document.documentElement.dataset.theme=theme;
 localStorage.setItem('agri_theme',theme);
 const b=document.getElementById('themeToggle');
 if(b){b.textContent=theme==='dark'?'☀ Light mode':'☾ Dark mode';b.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode');}
}
function toggleTheme(){applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark')}
(function(){document.documentElement.dataset.theme=localStorage.getItem('agri_theme')||'light'})();
function toggleNav(){
  const n=document.getElementById('mainNav');
  const b=document.getElementById('menuToggle');
  if(!n||!b)return;
  const opened=n.classList.toggle('open');
  b.classList.toggle('is-open',opened);
  b.setAttribute('aria-expanded',String(opened));
  b.setAttribute('aria-label',opened?'Close navigation menu':'Open navigation menu');
}

function applyLanguage(){
 if(!['hi','pa'].includes(state.language))return;
 const dict=state.language==='pa'?paText:hiText;
 const root=document.getElementById('app'); if(!root)return;
 const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
 nodes.forEach(n=>{let s=n.nodeValue.trim();if(!s)return;let out=s;
  Object.keys(dict).sort((a,b)=>b.length-a.length).forEach(k=>{if(out===k)out=dict[k];else if(k.length>5&&out.includes(k))out=out.split(k).join(dict[k]);});
  if(out!==s)n.nodeValue=n.nodeValue.replace(s,out);
 });
 root.querySelectorAll('input[placeholder],option').forEach(el=>{const v=el.getAttribute('placeholder')||el.textContent; const translated=dict[v]||dict[v.trim()]; if(translated){if(el.tagName==='OPTION')el.textContent=translated;else el.setAttribute('placeholder',translated);}});
 document.documentElement.lang=state.language==='pa'?'pa':'hi';
}
function layout(body){document.getElementById('app').innerHTML=nav()+`<main class="container">${body}<div class="footer">Agri-Smart stores your farm records on the server's local data file. Back up <b>data/db.json</b> regularly. Official source links are provided for reference.</div></main>`;document.querySelectorAll('.global-voice').forEach(x=>x.remove());document.body.insertAdjacentHTML('beforeend',`<button class=global-voice onclick=startSectionVoice()>${state.language==='pa'?'ਆਵਾਜ਼':state.language==='hi'?'आवाज़':'Voice'}</button>`);applyLanguage();applyTheme(document.documentElement.dataset.theme||localStorage.getItem('agri_theme')||'light');window.scrollTo({top:0,behavior:'instant'})}
function settings(){layout(`<div class="section-title"><div><h2> Settings</h2><span class="muted">Language & display</span></div></div><div class="panel" style="max-width:760px"><h3>Language & display</h3><p class="muted">Choose the language used for the website interface. Your choice will be saved on this device.</p><form class="form" onsubmit="saveLanguage(event)"><div class="field"><label for="languageSelect">Website language</label><select id="languageSelect"><option value="en" ${state.language==='en'?'selected':''}>English</option><option value="hi" ${state.language==='hi'?'selected':''}>Hindi (हिन्दी)</option><option value="pa">Punjabi (ਪੰਜਾਬੀ)</option></select></div><p class="muted">The green-and-cream Agri-Smart colour theme stays the same in both languages.</p><button class="primary">Save language</button><div id="languageMsg" class="notice hidden"></div></form></div>`);document.getElementById("languageSelect").value=state.language;}
function saveLanguage(e){e.preventDefault();state.language=document.getElementById('languageSelect').value;localStorage.setItem('agri_language',state.language);settings();const m=document.getElementById('languageMsg');m.textContent=state.language==='hi'?'आपकी भाषा की पसंद सहेज दी गई है।':state.language==='pa'?'ਤੁਹਾਡੀ ਭਾਸ਼ਾ ਦੀ ਚੋਣ ਸੰਭਾਲ ਲਈ ਗਈ ਹੈ।':'Your language preference has been saved.';m.classList.remove('hidden');}

function home(){layout(`<section class="hero"><div class="hero-card"><span class="pill">INDIA • FARMER-FIRST</span><h1>One smart place for your farm records.</h1><p>Track farms, soil tests, crops and yields while keeping trusted agriculture resources close at hand. Built for Indian farmers and local/self-hosted use.</p><div class="cta"><button class="primary" onclick="go('${state.user?'dashboard':'register'}')">${state.user?'Open My Farm':'Create farmer account'}</button><button class="secondary" onclick="go('sources')">Explore trusted sources</button></div></div><div class="panel"><h3>What you can store</h3><div class="list"><div class="item"> <b>Farm profiles</b><br><span class="muted">Area, location, soil and irrigation</span></div><div class="item"> <b>Soil tests</b><br><span class="muted">pH, N, P, K and organic carbon</span></div><div class="item"> <b>Crop history</b><br><span class="muted">Season, yield, cost and revenue</span></div><div class="item"> <b>Operator records</b><br><span class="muted">Search, audit history and CSV exports</span></div></div></div></section><div class="section-title"><h2>Built for practical farm management</h2></div><div class="feature-grid"><div class="feature"><b>Persistent records</b><span class="muted">Data survives browser refreshes because it is stored by the local server.</span></div><div class="feature"><b>Accounts</b><span class="muted">Each farmer gets a private login and their own records.</span></div><div class="feature"><b>India coverage</b><span class="muted">State and Union Territory selector included across the app.</span></div></div>`)}
function auth(mode){layout(`<div class="auth-wrap"><div class="auth"><h1>${mode==='login'?'Welcome back':'Create your farmer account'}</h1><p class="muted">${mode==='login'?'Sign in to access your stored farm records.':'Your information will be stored in the Agri-Smart server database.'}</p><div id="authMsg"></div><form class="form" onsubmit="${mode==='login'?'doLogin':'doRegister'}(event)">${mode==='register'?`<div class="field"><label>Full name</label><input id="name" required></div>`:''}<div class="field"><label>Email</label><input id="email" type="email" required></div>${mode==='register'?`<div class="row"><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>State / UT</label><select id="state"><option value="">Select</option>${state.states.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div></div><div class="field"><label>District</label><input id="district"></div>`:''}<div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="primary">${mode==='login'?'Login':'Create account'}</button></form><p class="muted" style="margin-top:18px">${mode==='login'?`New farmer? <a href="#" onclick="go('register');return false">Create an account</a>`:`Already registered? <a href="#" onclick="go('login');return false">Login</a>`}</p></div></div>`)}
async function doRegister(e){e.preventDefault();try{const nameEl=document.getElementById('name'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),phoneEl=document.getElementById('phone'),stateEl=document.getElementById('state'),districtEl=document.getElementById('district');const d=await api('/api/register',{method:'POST',body:JSON.stringify({name:nameEl.value.trim(),email:emailEl.value.trim(),password:passwordEl.value,phone:phoneEl.value.trim(),state:stateEl.value,district:districtEl.value.trim()})});state.token=d.token;state.user=d.user;localStorage.setItem('agri_token',state.token);go('dashboard')}catch(x){document.getElementById('authMsg').innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}
async function doLogin(e){e.preventDefault();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});state.token=d.token;state.user=d.user;localStorage.setItem('agri_token',state.token);go(d.user.role==='admin'?'admin':'dashboard')}catch(x){authMsg.innerHTML=`<div class="notice error">${esc(x.message)}</div>`}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}state.token=null;state.user=null;localStorage.removeItem('agri_token');go('home')}
async function dashboard(){if(!state.user){go('login');return}state.dash=await api('/api/dashboard');const d=state.dash;layout(`<div class="section-title"><div><h2>My Farm Dashboard</h2><span class="muted">Welcome, ${esc(state.user.name)}</span></div><button class="secondary" onclick="go('profile')">Edit profile</button></div><div class="cards"><div class="stat"><span class="muted">Farms</span><div class="num">${d.stats.farms}</div></div><div class="stat"><span class="muted">Soil tests</span><div class="num">${d.stats.soilTests}</div></div><div class="stat"><span class="muted">Crop records</span><div class="num">${d.stats.crops}</div></div><div class="stat"><span class="muted">Account</span><div class="num" style="font-size:18px">${esc(state.user.state||'India')}</div></div></div><div class="section-title"><h2>Farm records</h2></div><div class="tabs"><button class="tab ${state.tab==='farms'?'active':''}" onclick="state.tab='farms';dashboard()">Farms</button><button class="tab ${state.tab==='soil'?'active':''}" onclick="state.tab='soil';dashboard()">Soil tests</button><button class="tab ${state.tab==='crops'?'active':''}" onclick="state.tab='crops';dashboard()">Crop history</button></div>${state.tab==='farms'?farmPanel(d.farms):state.tab==='soil'?soilPanel(d.soilTests,d.farms):cropPanel(d.crops,d.farms)}`)}

async function addFarm(e){e.preventDefault();try{await api('/api/farms',{method:'POST',body:JSON.stringify({name:farmName.value,state:farmState.value,district:farmDistrict.value,village:farmVillage.value,area:farmArea.value,unit:farmUnit.value,soilType:soilType.value,irrigation:irrigation.value})});dashboard()}catch(x){alert(x.message)}}
function soilPanel(rows,farms){return `<div class="grid2"><div class="panel"><h3>Add soil test</h3><form class="form" onsubmit="addSoil(event)"><div class="row"><div class="field"><label>Farm</label><select id="soilFarm"><option value="">General</option>${farms.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="soilDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div class="row"><div class="field"><label>pH</label><input id="ph" type="number" step="0.01"></div><div class="field"><label>Organic carbon %</label><input id="oc" type="number" step="0.01"></div></div><div class="row"><div class="field"><label>Nitrogen</label><input id="nitrogen" type="number" step="0.01"></div><div class="field"><label>Phosphorus</label><input id="phosphorus" type="number" step="0.01"></div></div><div class="field"><label>Potassium</label><input id="potassium" type="number" step="0.01"></div><div class="field"><label>Notes</label><textarea id="soilNotes"></textarea></div><button class="primary">Save soil test</button></form></div><div class="panel"><h3>Saved soil tests</h3>${rows.length?`<div class="list">${rows.map(s=>`<div class="item"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><b>${esc(s.date)}</b> <span class="pill">pH ${esc(s.ph??'—')}</span></div><button class="secondary" type="button" onclick="deleteSoil('${s.id}')">Delete test</button></div><div class="muted">N: ${esc(s.nitrogen??'—')} • P: ${esc(s.phosphorus??'—')} • K: ${esc(s.potassium??'—')} • OC: ${esc(s.organicCarbon??'—')}%</div></div>`).join('')}</div>`:`<div class="empty">No soil tests recorded.</div>`}</div></div>`}
async function addSoil(e){e.preventDefault();try{await api('/api/soil-tests',{method:'POST',body:JSON.stringify({farmId:soilFarm.value,date:soilDate.value,ph:ph.value,nitrogen:nitrogen.value,phosphorus:phosphorus.value,potassium:potassium.value,organicCarbon:oc.value,notes:soilNotes.value})});dashboard()}catch(x){alert(x.message)}}
async function deleteSoil(id){if(!confirm('Delete this soil test? This cannot be undone.'))return;try{await api('/api/soil-tests/'+encodeURIComponent(id),{method:'DELETE'});dashboard()}catch(x){alert(x.message)}}
function cropPanel(rows,farms){return `<div class="grid2"><div class="panel"><h3>Add crop record</h3><form class="form" onsubmit="addCrop(event)"><div class="row"><div class="field"><label>Farm</label><select id="cropFarm"><option value="">Select</option>${farms.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></div><div class="field"><label>Crop</label><input id="crop" required placeholder="Wheat, rice..."></div></div><div class="row"><div class="field"><label>Season</label><select id="season"><option>Kharif</option><option>Rabi</option><option>Zaid</option><option>Other</option></select></div><div class="field"><label>Year</label><input id="year" type="number" value="${new Date().getFullYear()}"></div></div><div class="row"><div class="field"><label>Area</label><input id="cropArea" type="number" step="0.01"></div><div class="field"><label>Yield</label><input id="yieldAmount" type="number" step="0.01"></div></div><div class="row"><div class="field"><label>Yield unit</label><select id="yieldUnit"><option>quintal</option><option>tonne</option><option>kg</option></select></div><div class="field"><label>Revenue ₹</label><input id="revenue" type="number"></div></div><div class="field"><label>Cost ₹</label><input id="cost" type="number"></div><button class="primary">Save crop record</button></form></div><div class="panel"><h3>Crop history</h3>${rows.length?`<div class="list">${rows.map(c=>`<div class="item"><h4> ${esc(c.crop)} <span class="pill">${esc(c.season)} ${esc(c.year)}</span></h4><div class="muted">Yield: ${esc(c.yieldAmount)} ${esc(c.yieldUnit)} • Revenue: ₹${esc(c.revenue)} • Cost: ₹${esc(c.cost)}</div></div>`).join('')}</div>`:`<div class="empty">No crop records yet.</div>`}</div></div>`}
async function addCrop(e){e.preventDefault();try{await api('/api/crops',{method:'POST',body:JSON.stringify({farmId:cropFarm.value,crop:crop.value,season:season.value,year:year.value,area:cropArea.value,yieldAmount:yieldAmount.value,yieldUnit:yieldUnit.value,revenue:revenue.value,cost:cost.value})});dashboard()}catch(x){alert(x.message)}}
async function profile(){const u=state.user;layout(`<div class="section-title"><h2>Profile</h2></div><div class="panel" style="max-width:760px"><form class="form" onsubmit="saveProfile(event)"><div class="row"><div class="field"><label>Name</label><input id="pname" value="${esc(u.name)}"></div><div class="field"><label>Phone</label><input id="pphone" value="${esc(u.phone)}"></div></div><div class="row"><div class="field"><label>State / UT</label><select id="pstate"><option value="">Select</option>${state.states.map(s=>`<option ${s===u.state?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>District</label><input id="pdistrict" value="${esc(u.district)}"></div></div><button class="primary">Save profile</button></form></div>`)}
async function saveProfile(e){e.preventDefault();const d=await api('/api/profile',{method:'PUT',body:JSON.stringify({name:pname.value,phone:pphone.value,state:pstate.value,district:pdistrict.value})});state.user=d.user;dashboard()}

function devanagariToPunjabi(value){
 const map={'अ':'ਅ','आ':'ਆ','इ':'ਇ','ई':'ਈ','उ':'ਉ','ऊ':'ਊ','ऋ':'ਰਿ','ए':'ਏ','ऐ':'ਐ','ओ':'ਓ','औ':'ਔ','ा':'ਾ','ि':'ਿ','ी':'ੀ','ु':'ੁ','ू':'ੂ','ृ':'੍ਰਿ','े':'ੇ','ै':'ੈ','ो':'ੋ','ौ':'ੌ','ं':'ੰ','ँ':'ਂ','ः':'ਃ','्':'੍','क':'ਕ','ख':'ਖ','ग':'ਗ','घ':'ਘ','ङ':'ਙ','च':'ਚ','छ':'ਛ','ज':'ਜ','झ':'ਝ','ञ':'ਞ','ट':'ਟ','ठ':'ਠ','ड':'ਡ','ढ':'ਢ','ण':'ਣ','त':'ਤ','थ':'ਥ','द':'ਦ','ध':'ਧ','न':'ਨ','प':'ਪ','फ':'ਫ','ब':'ਬ','भ':'ਭ','म':'ਮ','य':'ਯ','र':'ਰ','ल':'ਲ','व':'ਵ','श':'ਸ਼','ष':'ਸ਼','स':'ਸ','ह':'ਹ','ड़':'ੜ','ढ़':'ਢ਼','ळ':'ਲ','क्ष':'ਕ੍ਸ਼','त्र':'ਤ੍ਰ','ज्ञ':'ਗਿਆ','।':'।'};
 let out=String(value||'');
 // Convert common conjuncts first, then individual Devanagari characters.
 out=out.replace(/क्ष|त्र|ज्ञ|ड़|ढ़/g,x=>map[x]);
 return Array.from(out).map(ch=>map[ch]??ch).join('').replace(/੍੍/g,'੍');
}
function paCropName(c){return cropPa[c.crop]||c.cropPa||devanagariToPunjabi(c.cropHi||c.crop);}
function paReason(reason){const rules=[[/warm-season pulse/i,'ਗਰਮ ਮੌਸਮ ਦੀ ਦਾਲਾਂ ਵਾਲੀ ਫ਼ਸਲ; ਖੇਤ ਵਿੱਚ ਪਾਣੀ ਖੜ੍ਹਾ ਨਾ ਹੋਣ ਦਿਓ ਅਤੇ ਸਥਾਨਕ ਤੌਰ ’ਤੇ ਸਿਫ਼ਾਰਸ਼ ਕੀਤੀਆਂ ਕਿਸਮਾਂ ਵਰਤੋ।'],[/avoid waterlogged fields/i,'ਖੇਤ ਵਿੱਚ ਪਾਣੀ ਖੜ੍ਹਾ ਹੋਣ ਤੋਂ ਬਚਾਓ।'],[/well-drained/i,'ਚੰਗੇ ਨਿਕਾਸ ਵਾਲੀ ਮਿੱਟੀ ਲੋੜੀਂਦੀ ਹੈ।'],[/moderate water/i,'ਇਸ ਨੂੰ ਦਰਮਿਆਨੇ ਪਾਣੀ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ।'],[/high water/i,'ਇਸ ਨੂੰ ਵੱਧ ਪਾਣੀ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ।'],[/low water/i,'ਇਸ ਨੂੰ ਘੱਟ ਪਾਣੀ ਦੀ ਲੋੜ ਹੁੰਦੀ ਹੈ।'],[/local climate/i,'ਇਸ ਦੀ ਢੁੱਕਵੀਂਤਾ ਸਥਾਨਕ ਮੌਸਮ ਉੱਤੇ ਨਿਰਭਰ ਕਰਦੀ ਹੈ।'],[/verify local recommendations/i,'ਬਿਜਾਈ ਤੋਂ ਪਹਿਲਾਂ ਸਥਾਨਕ ਖੇਤੀਬਾੜੀ ਮਾਹਿਰ ਦੀ ਸਲਾਹ ਲਵੋ।'],[/suitable humid/i,'ਇਹ ਨਮੀ ਵਾਲੇ ਇਲਾਕਿਆਂ ਲਈ ਢੁੱਕਵੀਂ ਹੈ।'],[/fertile/i,'ਉਪਜਾਊ ਮਿੱਟੀ ਵਿੱਚ ਵਧੀਆ ਨਤੀਜੇ ਮਿਲ ਸਕਦੇ ਹਨ।']];let out=String(reason||'');for(const [re,pa] of rules)if(re.test(out))out=out.replace(re,pa);return out===String(reason||'')?'ਇਸ ਫ਼ਸਲ ਦੀ ਢੁੱਕਵੀਂਤਾ ਮਿੱਟੀ, ਪਾਣੀ, ਮੌਸਮ ਅਤੇ ਸਥਾਨਕ ਹਾਲਤਾਂ ਉੱਤੇ ਨਿਰਭਰ ਕਰਦੀ ਹੈ। ਸਥਾਨਕ ਖੇਤੀ ਮਾਹਿਰ ਨਾਲ ਪੁਸ਼ਟੀ ਕਰੋ।':out;}
function drawRec(){
  const hi=state.language==='hi', pa=state.language==='pa';
  const rawState=recState.value.trim();
  const stateReverse=Object.fromEntries(Object.entries(cropPa).map(([en,local])=>[String(local).normalize('NFC').toLocaleLowerCase(),en]));
  const st=stateReverse[rawState.normalize('NFC').toLocaleLowerCase()]||rawState;
  const di=recDistrict.value.trim().toLocaleLowerCase().normalize('NFC'),se=recSeason.value,so=recSoil.value,phv=recPh.value.trim()===''?NaN:parseFloat(recPh.value),wa=recWater.value,pr=recPref.value,q=recSearch.value.trim().toLocaleLowerCase();
  const rows=recommendationCrops.map(c=>{
   let score=0;
   if(st){if(c.states.includes(st))score+=5;else return null}
   if(di){const districtsByState={Punjab:['patiala','ludhiana','amritsar','bathinda','moga','sangrur'],Haryana:['hisar','fatehabad','tohana','sirsa','rohtak','karnal','kurukshetra','ambala'],Rajasthan:['sri ganganagar','hanumangarh','jaipur','bikaner','kota'], 'Uttar Pradesh':['meerut','agra','kanpur','lucknow','varanasi'], 'Himachal Pradesh':['shimla','solan','kangra','mandi'],Uttarakhand:['dehradun','haridwar','udhamsingh nagar','nainital'],Bihar:['patna','muzaffarpur','gaya']};
    const isKnown=Object.values(districtsByState).flat().some(x=>x===di||x.includes(di)||di.includes(x));
    if(c.districts?.some(d=>d.toLowerCase()===di||d.toLowerCase().includes(di)||di.includes(d.toLowerCase())))score+=4;
    else if(st && c.states.includes(st))score+=1;
    else if(!isKnown && (c.states.join(' ').toLowerCase().includes(di)||c.statesHi.join(' ').toLocaleLowerCase().includes(di)))score+=2;
    else score+=0.25; // District is a soft preference, not a hard exclusion.
   }
   if(se){if(c.season===se || (se==='Annual' && ['Annual','Rabi'].includes(c.season)))score+=3;else return null}
   if(so){if(c.soil.includes(so))score+=2;else return null}
   if(!Number.isNaN(phv)){if(phv>=c.ph[0]&&phv<=c.ph[1])score+=2;else return null}
   if(wa){if(c.water===wa)score+=2;else if((wa==='High'&&c.water==='Moderate')||(wa==='Moderate'&&c.water==='Low'))score+=1;else return null}
   if(pr){if(c.preference===pr)score+=2;else return null}
   if(q){const norm=v=>String(v||'').toLocaleLowerCase().normalize('NFC');const hay=norm([c.crop,c.cropHi,c.preference,c.preferenceHi,c.season,c.seasonHi,...c.states,...c.statesHi,...c.soil,...c.soilHi,...[c.crop,c.preference,c.season,c.water,...c.states,...c.soil].map(v=>cropPa[v]||'')].join(' '));const queryAliases=stateReverse[norm(q)]||q;if(!hay.includes(norm(queryAliases))&&!hay.includes(norm(q)))return null}
   return {...c,score};
  }).filter(Boolean).sort((a,b)=>b.score-a.score);
  document.getElementById('recCount').textContent=pa?`${rows.length} ਮਿਲਦੀਆਂ ਫ਼ਸਲਾਂ`:hi?`${rows.length} मिलते-जुलते विकल्प`:`${rows.length} matching option${rows.length===1?'':'s'}`;
  const txt=(en,h)=>pa?(paText[en]||cropPa[en]||h||en):(hi?h:en);
  document.getElementById('recResults').innerHTML=rows.length?`<div class="grid2">${rows.map(c=>`<div class="panel crop-result-card"><div class="section-title" style="margin:0 0 10px"><h2 style="font-size:20px">${esc(pa?paCropName(c):txt(c.crop,c.cropHi))}</h2><span class="pill">${esc(pa?(cropPa[c.season]||c.season):txt(c.season,c.seasonHi))}</span></div><p class="muted"><b>${txt('Region / क्षेत्र:','क्षेत्र:')}</b> ${esc((pa?c.states.map(x=>cropPa[x]||x):(hi?c.statesHi:c.states)).join(', '))}</p><p class="muted"><b>${txt('Soil / मिट्टी:','मिट्टी:')}</b> ${esc((pa?c.soil.map(x=>cropPa[x]||x):(hi?c.soilHi:c.soil)).join(', '))} • <b>pH:</b> ${c.ph[0]}–${c.ph[1]} • <b>${txt('Water:','पानी:')}</b> ${esc(pa?(cropPa[c.water]||c.water):txt(c.water,c.waterHi))}</p><p class="muted"><b>${txt('Crop type:','फसल का प्रकार:')}</b> ${esc(pa?(cropPa[c.preference]||c.preference):txt(c.preference,c.preferenceHi))} • <b>${txt('Season:','मौसम:')}</b> ${esc(pa?(cropPa[c.season]||c.season):txt(c.season,c.seasonHi))}</p><div class="notice"><b>${txt('Why this crop may fit:','यह फसल क्यों उपयुक्त हो सकती है:')}</b> ${esc(pa?(c.reasonPa||paReason(c.reason)||c.reason):txt(c.reason,c.reasonHi))}${st?` ${txt('Selected state:','चुना गया राज्य:')} <b>${esc(pa?(cropPa[st]||st):(hi?(c.statesHi[c.states.indexOf(st)]||st):st))}</b>.`:''}${di?` ${txt('District preference used as a soft match.','ज़िले को सहायक प्राथमिकता के रूप में माना गया है।')}`:''}</div></div>`).join('')}</div>`:`<div class="panel empty">${txt('No crops match every strict filter. Try removing one filter.','सभी चुने गए फ़िल्टर से फसल नहीं मिली। कोई एक फ़िल्टर हटाकर देखें।')}</div>`;
 }
 ['recState','recDistrict','recSeason','recSoil','recPh','recWater','recPref','recSearch'].forEach(id=>{document.getElementById(id).addEventListener(id==='recDistrict'||id==='recSearch'?'input':'change',drawRec)}); drawRec();
}

 const cropQ=raw.replace(/\b(search|find|show|recommend|recommendation|crop|crops|please|voice|assistant|फसल|खोजो|दिखाओ|बताओ|सुझाव|चाहिए|मुझे|कृपया|की|के|लिए)\b/giu,' ').trim();
 // If the command is primarily a crop name or general query, use it as the crop text search.
 if(cropQ && !/^(for|in|on|with|my|मेरे|में|और|है|हो|को)$/i.test(cropQ) && !used.includes('recSearch')){const el=document.getElementById('recSearch');if(el){el.value=cropQ;el.dispatchEvent(new Event('input',{bubbles:true}));used.push('recSearch')}}
 const hi=state.language==='hi';const msg=(hi?'आपने कहा: ':'Heard: ')+raw+(used.length?(hi?'। फ़िल्टर अपडेट कर दिए हैं।':' — filters updated.'):(hi?'। खोज शब्द डाल दिया है।':' — search text applied.'));
 voiceStatus(msg);voiceSay(msg);
 if(assistantMode)setTimeout(speakAgriResults,500);
}
function speakAgriResults(){
 const hi=state.language==='hi';const cards=[...document.querySelectorAll('#recResults .panel')];
 if(!cards.length){const m=hi?'अभी कोई फसल परिणाम नहीं हैं। फ़िल्टर बदलें या आवाज़ से दूसरी खोज करें।':'There are no matching crop results yet. Change a filter or try another voice search.';voiceStatus(m);voiceSay(m);return}
 const names=cards.slice(0,5).map(c=>{const h=c.querySelector('h2');return h?h.textContent.replace(/^\s*/, '').trim():''}).filter(Boolean);
 const count=cards.length;const summary=hi?`आपके लिए ${count} फसल विकल्प मिले हैं। इनमें से कुछ हैं: ${names.join(', ')}। हर विकल्प में मिट्टी, पीएच, पानी की ज़रूरत और फसल उपयुक्त होने का कारण दिया गया है। यह सामान्य मार्गदर्शन है; बुवाई से पहले स्थानीय कृषि विशेषज्ञ से पुष्टि करें।`:`I found ${count} matching crop options. Some results are: ${names.join(', ')}. Each result includes soil type, pH range, water needs, and why the crop may fit. This is general guidance; confirm with a local agriculture expert before sowing.`;
 voiceStatus(summary);voiceSay(summary);
}

async function sources(){if(!state.sources.length)state.sources=(await api('/api/sources')).sources;layout(`<div class="section-title"><div><h2>Trusted Agriculture Sources</h2><span class="muted">Government and research portals linked directly for reference.</span></div></div><div class="grid2">${state.sources.map(s=>`<div class="panel source"><div><h3 style="margin:0 0 6px">${esc(s.name)}</h3><span class="pill">${esc(s.type)}</span></div><a href="${esc(s.url)}" target="_blank" rel="noopener">Open ↗</a></div>`).join('')}</div>`)}
async function admin(){if(state.user?.role!=='admin'){go('login');return}const [u,a]=await Promise.all([api('/api/admin/users'),api('/api/admin/audit')]);state.adminUsers=u.users;state.audit=a.audit;layout(`<div class="section-title"><div><h2>Operator Dashboard</h2><span class="muted">Manage visibility of registered records and export datasets.</span></div></div><div class="cards"><div class="stat"><span class="muted">Registered accounts</span><div class="num">${state.adminUsers.length}</div></div><div class="stat"><span class="muted">Farmers</span><div class="num">${state.adminUsers.filter(x=>x.role==='farmer').length}</div></div><div class="stat"><span class="muted">Audit events</span><div class="num">${state.audit.length}</div></div><div class="stat"><span class="muted">Exports</span><div class="num">4</div></div></div><div class="section-title"><h2>Accounts</h2></div><div class="panel"><div class="toolbar"><input id="userSearch" placeholder="Search name, email or state" oninput="filterUsers()"><div>${['users','farms','soil','crops'].map(x=>`<button class="secondary" onclick="exportAdminData('${x}')">Export ${x}</button>`).join(' ')}</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>State</th><th>Role</th><th>Created</th></tr></thead><tbody id="userRows">${userRows(state.adminUsers)}</tbody></table></div></div><div class="section-title"><h2>Recent audit history</h2></div><div class="panel"><div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody>${state.audit.slice(0,80).map(a=>`<tr><td>${new Date(a.at).toLocaleString()}</td><td>${esc(a.actorName)}</td><td>${esc(a.action)}</td><td>${esc(a.entity)}</td><td>${esc(a.details)}</td></tr>`).join('')}</tbody></table></div></div>`)}
async function exportAdminData(type){try{const response=await fetch('/api/admin/export?type='+encodeURIComponent(type),{headers:{Authorization:'Bearer '+state.token}});if(!response.ok){let msg='Export failed';try{msg=(await response.json()).error||msg}catch{}throw new Error(msg)}const blob=await response.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='agri-smart-'+type+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}catch(e){alert(e.message)}}
function userRows(rows){return rows.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.state||'—')}</td><td>${esc(u.role)}</td><td>${new Date(u.createdAt).toLocaleDateString()}</td></tr>`).join('')}
function filterUsers(){const q=userSearch.value.toLowerCase();document.getElementById('userRows').innerHTML=userRows(state.adminUsers.filter(u=>JSON.stringify(u).toLowerCase().includes(q)))}
async function go(v){state.view=v;const mn=document.getElementById('mainNav'),mb=document.getElementById('menuToggle');if(mn)mn.classList.remove('open');if(mb){mb.classList.remove('is-open');mb.setAttribute('aria-expanded','false');mb.setAttribute('aria-label','Open navigation menu')};try{if(v==='home')home();else if(v==='login')auth('login');else if(v==='register')auth('register');else if(v==='dashboard')dashboard();else if(v==='profile')profile();else if(v==='recommend')recommend();else if(v==='sources')sources();else if(v==='admin')admin();else if(v==='settings')settings()}catch(e){document.getElementById('app').innerHTML=nav()+`<main class="container"><div class="notice error">${esc(e.message)}</div></main>`}}
// Render a usable screen immediately; never leave #app blank while the API is loading.
function showStartupError(err){
 const app=document.getElementById('app');
 const msg=String(err&&err.message?err.message:err||'Unknown startup error');
 app.innerHTML=`<main class="container" style="padding-top:48px"><section class="panel" style="max-width:760px;margin:0 auto"><div class="logo" style="width:76px;height:76px;margin-bottom:18px"><img src="/agri-smart-logo.webp" alt="Agri-Smart" style="width:100%;height:100%;object-fit:contain"></div><h1>Agri-Smart could not finish loading</h1><p class="muted">The page itself loaded, but the server did not return the startup data. Check that you opened the website through the Node server, not by double-clicking index.html.</p><div class="notice error">${esc(msg)}</div><p class="muted">Make sure the terminal says the server is running, then reload this page. If you use another port, open the exact localhost address printed by the terminal.</p><button class="primary" onclick="location.reload()">Try again</button></section></main>`;
}
window.addEventListener('error',e=>{console.error('Agri-Smart runtime error:',e.error||e.message);if(!document.querySelector('#app .container'))showStartupError(e.error||e.message)});
window.addEventListener('unhandledrejection',e=>{console.error('Agri-Smart async error:',e.reason);if(!document.querySelector('#app .container'))showStartupError(e.reason)});
// Show the home page immediately, then load server data in the background.
try{home()}catch(e){showStartupError(e)}
(async()=>{
 try{
  const s=await api('/api/states');
  if(!s||!Array.isArray(s.states))throw new Error('The /api/states response is missing the states list.');
  state.states=s.states;
  if(state.token){try{state.user=(await api('/api/me')).user}catch(e){state.token=null;localStorage.removeItem('agri_token');console.warn('Saved login expired; showing public home page.',e)}}
  if(state.view==='home'&&!state.user){home()}
  else if(state.user&&state.view==='home'){go('dashboard')}
 }catch(e){console.error('Startup API request failed:',e);showStartupError(e)}
})();
</script></body></html>
